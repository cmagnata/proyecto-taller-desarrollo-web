<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Turnos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">

</head>

<body class="bg-light">
    <section id="vistaCliente">
        <div class="container py-5" style="max-width: 500px;">
            <h1 class="text-center mb-4">Toma de Turnos</h1>
            <div class="mt-2" style="margin:auto; text-center:justify">
                <button type="submit" class="btn btn-primary">Urgencia</button>
            </div>
            <div class="row" style="padding:10px; margin:auto">
                <button type="submit" class="btn btn-primary">Urgencia</button>
            </div>
            <div class="row" style="padding:10px; margin:auto">
                <button type="submit" class="btn btn-primary">Urgencia</button>
            </div>
            <div class="row" style="padding:10px; margin:auto">
                <button type="submit" class="btn btn-primary">Urgencia</button>
            </div>
        </div>
        <ul id="listaTareas" class="list-group"></ul>
    </section>


    <section id="vistaPantalla">
        <h1 class="text-center mb-4">Pantalla de Turnos</h1>
        <div class="container">
            <div class="row">
                <div class="col-8 text-center">
                    <h2>Turno actual</h2>
                    <div id="numeroModulo">-</div>
                    <div id="tipoAtencion">-</div>
                </div>

                <div class="col-4 text-center">
                    <div class="cuadroInfo">
                        <h2>Turnos en cola</h2>
                        <div id="cantidadCola">-</div>
                    </div>
                    <div class="cuadroInfo">
                        <h2>Personas atendidas</h2>
                        <div id="cantidadAtendidos">-</div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <section id="vistaOperador">

    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
